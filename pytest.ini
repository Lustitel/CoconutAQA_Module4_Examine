[pytest]
markers =
    smoke: быстрые проверки основных сценариев
    regression: регрессионные тесты
    slow: медленные тесты
    api: тесты через API
    filters: тесты фильтров
    positive: позитивные тесты
    negative: негативные тесты
    creation: создание ресурсов

testpaths = tests
pythonpath = . ../..
log_cli = true
log_cli_level = INFO
log_format = %(message)s
